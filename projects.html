        <!-- ========================================================
             FILTER BUTTONS
             One button per category: All | Web | Programming | Data ...
             Tip: give each button a data attribute, e.g.
               <button class="btn ..." data-category="Web">Web</button>
             so your JavaScript can tell which one was clicked.
             ======================================================== -->
            <div class="d-flex flex-wrap gap-2 mb-3">
                <button class="btn btn-outline-primary active" data-category="All">All</button>
                <button class="btn btn-outline-primary" data-category="Finance">Finance</button>

             PROJECT CARDS CONTAINER
             Leave this EMPTY. JavaScript will fill it with cards
